name: tab

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}?sslmode=disable
  KAFKA_BROKERS: redpanda:9092
  KAFKA_TOPIC: expense.events
  MONGODB_URI: mongodb://mongodb:27017
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"

x-app-depends: &app-depends
  postgres:
    condition: service_healthy
  redpanda:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 3s
      retries: 20

  redpanda:
    image: redpandadata/redpanda:v24.3.18
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "127.0.0.1:19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  mongodb:
    image: mongo:8.2
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"

  migrate:
    image: localhost/tab-app:dev
    build:
      context: .
    command: ["/app/migrate"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  api:
    image: localhost/tab-app:dev
    pull_policy: never
    command: ["/app/tab-api"]
    environment:
      <<: *app-env
      HTTP_ADDRESS: :8080
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?set JWT_SIGNING_KEY}
      ADMIN_REPLAY_KEY: ${ADMIN_REPLAY_KEY:?set ADMIN_REPLAY_KEY}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      <<: *app-depends
      migrate:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/tab-api", "--healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  frontend:
    image: localhost/tab-web:dev
    build:
      context: ./web
    ports:
      - "127.0.0.1:3000:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  outbox-publisher:
    image: localhost/tab-app:dev
    pull_policy: never
    command: ["/app/outbox-publisher"]
    environment: *app-env
    depends_on:
      <<: *app-depends
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  balance-consumer:
    image: localhost/tab-app:dev
    pull_policy: never
    command: ["/app/consumer"]
    environment:
      <<: *app-env
      WORKER_ROLE: balance
    depends_on:
      <<: *app-depends
      migrate:
        condition: service_completed_successfully
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  feed-consumer:
    image: localhost/tab-app:dev
    pull_policy: never
    command: ["/app/consumer"]
    environment:
      <<: *app-env
      WORKER_ROLE: feed
    depends_on:
      <<: *app-depends
      migrate:
        condition: service_completed_successfully
      mongodb:
        condition: service_healthy
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  notification-consumer:
    image: localhost/tab-app:dev
    pull_policy: never
    command: ["/app/consumer"]
    environment:
      <<: *app-env
      WORKER_ROLE: notification
    depends_on:
      <<: *app-depends
      migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  postgres-data:
  mongo-data:
